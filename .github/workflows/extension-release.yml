name: Extension release

# Publishes a versioned .vsix as a GitHub Release whenever a push to main
# touches a build input, instead of committing binary build artifacts into
# the repo tree. Committing dist/ and the .vsix directly turned out to be
# the wrong call: every release permanently grew git history with a new
# blob, and even a "delete the old one first" step couldn't reliably stage
# that deletion (a shell-expanded glob in a git add can never match a file
# that's already gone from disk — the previous fix for this looked right
# but silently did nothing). Releases sidestep the whole problem: each
# version's asset is scoped to its own release, nothing to clean up, and
# the repo tree never carries a binary.
#
# Typechecks + tests, bumps the patch version, builds dist/ + the .vsix
# (both untracked — see .gitignore), commits only the version bump
# (package.json/package-lock.json) back to main, tags it, and attaches the
# built .vsix to a new GitHub Release for that tag. The version-bump commit
# is authored by github-actions[bot] using the default GITHUB_TOKEN, which
# GitHub does not use to re-trigger push-triggered workflows, so this can't
# loop.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extension/src/**"
      - "extension/package.json"
      - "extension/package-lock.json"
      - "extension/esbuild.mjs"
      - "extension/tsconfig.json"
      - "extension/.vscodeignore"
      - "extension/media/**"
      - "skills/**"

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Test
        working-directory: extension
        run: npm test

      - name: Bump patch version
        id: bump
        working-directory: extension
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build dist/ and package the .vsix
        working-directory: extension
        run: |
          rm -rf dist
          rm -f ./*.vsix
          npm run package

      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/package.json extension/package-lock.json
          git commit -m "chore(extension): release v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          tag="extension-v${version}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" "extension/brain-md-${version}.vsix" \
            --title "brain.md extension v${version}" \
            --notes "Automated build from ${{ github.sha }}."
